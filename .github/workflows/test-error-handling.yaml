---
# SPDX-License-Identifier: Apache-2.0
# Test Bastion Timeout and Error Handling

name: Test Bastion Timeout and Error Handling

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      test_scenario:
        description: "Test scenario to run"
        required: true
        type: choice
        options:
          - "timeout"
          - "invalid_credentials"
          - "network_error"
        default: "timeout"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASTION_NAME: "test-error-bastion-${{ github.run_id }}"

permissions:
  contents: read

jobs:
  test-timeout-scenario:
    name: Test Timeout Scenario
    runs-on: ubuntu-latest
    # Secrets are consumed here; declare a dedicated environment. This
    # workflow is workflow_dispatch-only (manually triggered by a
    # maintainer), so it uses the unprotected 'integration-auto'
    # environment; no fork-PR approval gate applies here.
    environment: integration-auto
    timeout-minutes: 30
    if: inputs.test_scenario == 'timeout'

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Setup Tailscale on Runner
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          hostname: test-timeout-${{ github.run_id }}
          args: --ssh --accept-dns=false

      - name: Test Bastion Setup with Very Short Timeout
        id: setup
        continue-on-error: true
        uses: $/
        with:
          operation: "setup"
          openstack_auth_url: ${{ secrets.OPENSTACK_AUTH_URL }}
          openstack_project_id: ${{ secrets.OPENSTACK_PROJECT_ID }}
          openstack_username: ${{ secrets.OPENSTACK_USERNAME }}
          openstack_password: ${{ secrets.OPENSTACK_PASSWORD_B64 }}
          openstack_region: ${{ secrets.OPENSTACK_REGION }}
          openstack_network_id: ${{ secrets.OPENSTACK_NETWORK_ID }}
          bastion_flavor: "v3-standard-2"
          bastion_image: "Ubuntu 22.04.5 LTS (x86_64) [2025-03-27]"
          bastion_network: "odlci"
          bastion_name: ${{ env.BASTION_NAME }}
          bastion_wait_timeout: "30" # Very short timeout to trigger timeout
          tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tailscale_tags: "tag:bastion"
          debug_mode: "true"

      - name: Verify Timeout Behavior
        run: |
          echo "=== Checking Timeout Behavior ==="

          # The action should have timed out and cleaned up
          if [ "${STEPS_SETUP_OUTCOME}" == "failure" ]; then
            echo "✅ Action correctly failed on timeout"
          else
            echo "❌ Action should have timed out"
            exit 1
          fi
        env:
          STEPS_SETUP_OUTCOME: ${{ steps.setup.outcome }}

      - name: Verify Auto-Cleanup After Timeout
        env:
          # Secrets routed via env to avoid template injection
          OS_AUTH_URL: ${{ secrets.OPENSTACK_AUTH_URL }}
          OS_PROJECT_ID: ${{ secrets.OPENSTACK_PROJECT_ID }}
          OS_USERNAME: ${{ secrets.OPENSTACK_USERNAME }}
          OPENSTACK_PASSWORD_B64: ${{ secrets.OPENSTACK_PASSWORD_B64 }}
          OS_REGION_NAME: ${{ secrets.OPENSTACK_REGION }}
        run: |
          echo "Verifying bastion was cleaned up after timeout..."

          # Setup OpenStack CLI
          python -m pip install --upgrade pip
          pip install python-openstackclient

          # Configure OpenStack credentials (provided via job env)
          export OS_PASSWORD
          OS_PASSWORD=$(printf '%s' "${OPENSTACK_PASSWORD_B64}" | base64 -d)
          export OS_IDENTITY_API_VERSION="3"
          export OS_USER_DOMAIN_NAME="Default"
          export OS_PROJECT_DOMAIN_NAME="Default"

          # Wait a bit for cleanup to complete
          sleep 10

          # Check if bastion was cleaned up
          if openstack server show "${BASTION_NAME}" &>/dev/null; then
            echo "⚠️ WARNING: Bastion still exists - cleaning up manually"
            openstack server delete --wait "${BASTION_NAME}" || true
          else
            echo "✅ Bastion was automatically cleaned up after timeout"
          fi

      - name: Generate Summary
        if: always()
        env:
          # Step outcome routed via env to avoid template injection
          SETUP_RESULT: ${{ steps.setup.outcome == 'failure' && '✅ Pass' || '❌ Fail' }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: |
          {
            echo "## Timeout Test Summary"
            echo ""
            echo "- **Test Scenario:** Timeout with short wait period (30s)"
            echo "- **Expected:** Action fails and auto-cleans bastion"
            echo "- **Result:** ${SETUP_RESULT}"
            echo ""
            echo "### Details"
            echo "- Bastion setup outcome: ${SETUP_OUTCOME}"
            echo "- Auto-cleanup verified"
          } >> "$GITHUB_STEP_SUMMARY"

  test-invalid-credentials:
    name: Test Invalid Credentials
    runs-on: ubuntu-latest
    # Secrets are consumed here; declare a dedicated environment. This
    # workflow is workflow_dispatch-only (manually triggered by a
    # maintainer), so it uses the unprotected 'integration-auto'
    # environment; no fork-PR approval gate applies here.
    environment: integration-auto
    timeout-minutes: 30
    if: inputs.test_scenario == 'invalid_credentials'
    env:
      # A user unknown to the real cloud, so Keystone rejects the login
      # without counting a failure against the CI account's lockout.
      INVALID_USERNAME: "invalid-user"
      # openstack_password is base64 ("invalid-password"); plain text
      # would fail at decode and never reach Keystone.
      INVALID_PASSWORD_B64: "aW52YWxpZC1wYXNzd29yZA==" # gitleaks:allow

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Test with Invalid OpenStack Credentials
        id: setup
        continue-on-error: true
        uses: $/
        with:
          operation: "setup"
          # The real endpoint and project, so the request reaches Keystone
          # rather than failing on DNS for an invented host.
          openstack_auth_url: ${{ secrets.OPENSTACK_AUTH_URL }}
          openstack_project_id: ${{ secrets.OPENSTACK_PROJECT_ID }}
          openstack_username: ${{ env.INVALID_USERNAME }}
          openstack_password: ${{ env.INVALID_PASSWORD_B64 }}
          openstack_region: ${{ secrets.OPENSTACK_REGION }}
          bastion_name: ${{ env.BASTION_NAME }}
          tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}

      - name: Verify Error Handling
        id: verify
        env:
          STEPS_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          OS_AUTH_URL: ${{ secrets.OPENSTACK_AUTH_URL }}
          OS_PROJECT_ID: ${{ secrets.OPENSTACK_PROJECT_ID }}
          OS_REGION_NAME: ${{ secrets.OPENSTACK_REGION }}
        run: |
          if [ "${STEPS_SETUP_OUTCOME}" != "failure" ]; then
            echo "❌ Action should have failed with invalid credentials"
            exit 1
          fi

          # Any setup failure gives that outcome, so pin down where it
          # happened. The action installs the OpenStack CLI after its
          # Tailscale steps, so finding the CLI means those passed.
          if ! command -v openstack >/dev/null; then
            echo "❌ Action failed before credential validation"
            exit 1
          fi

          # The setup script logs from its first line. A log means the
          # action carried on past the failed credential check.
          if [ -e /tmp/bastion-setup.log ]; then
            echo "❌ Action continued past credential validation"
            exit 1
          fi

          # Confirm Keystone itself rejects these credentials, so the
          # check failed on authentication, not on the network.
          export OS_USERNAME="${INVALID_USERNAME}"
          export OS_PASSWORD
          OS_PASSWORD=$(printf '%s' "${INVALID_PASSWORD_B64}" | base64 -d)
          export OS_IDENTITY_API_VERSION="3"
          export OS_USER_DOMAIN_NAME="Default"
          export OS_PROJECT_DOMAIN_NAME="Default"

          if OUT=$(openstack token issue 2>&1); then
            echo "❌ The invalid credentials authenticated"
            exit 1
          elif printf '%s\n' "${OUT}" | grep -qF "HTTP 401"; then
            echo "✅ Action correctly failed: Keystone rejected the credentials"
          else
            echo "❌ Authentication failed for another reason:"
            echo "${OUT}"
            exit 1
          fi

      - name: Generate Summary
        if: always()
        env:
          # Step outcome routed via env to avoid template injection
          SETUP_RESULT: ${{ steps.verify.outcome == 'success' && '✅ Pass' || '❌ Fail' }}
        run: |
          {
            echo "## Invalid Credentials Test Summary"
            echo ""
            echo "- **Test Scenario:** Invalid OpenStack credentials"
            echo "- **Expected:** Keystone rejects them and the action stops before creating a bastion"
            echo "- **Result:** ${SETUP_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

  test-missing-tailscale-auth:
    name: Test Missing Tailscale Auth
    runs-on: ubuntu-latest
    # Secrets are consumed here; declare a dedicated environment. This
    # workflow is workflow_dispatch-only (manually triggered by a
    # maintainer), so it uses the unprotected 'integration-auto'
    # environment; no fork-PR approval gate applies here.
    environment: integration-auto
    timeout-minutes: 30
    if: inputs.test_scenario == 'network_error'

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Test with Missing Tailscale Credentials
        id: setup
        continue-on-error: true
        uses: $/
        with:
          operation: "setup"
          openstack_auth_url: ${{ secrets.OPENSTACK_AUTH_URL }}
          openstack_project_id: ${{ secrets.OPENSTACK_PROJECT_ID }}
          openstack_username: ${{ secrets.OPENSTACK_USERNAME }}
          openstack_password: ${{ secrets.OPENSTACK_PASSWORD_B64 }}
          openstack_region: ${{ secrets.OPENSTACK_REGION }}
          bastion_name: ${{ env.BASTION_NAME }}
          # Intentionally omit Tailscale credentials

      - name: Verify Error Handling
        run: |
          if [ "${STEPS_SETUP_OUTCOME}" == "failure" ]; then
            echo "✅ Action correctly failed with missing Tailscale auth"
          else
            echo "❌ Action should have failed with missing Tailscale auth"
            exit 1
          fi
        env:
          STEPS_SETUP_OUTCOME: ${{ steps.setup.outcome }}

      - name: Generate Summary
        if: always()
        env:
          # Step outcome routed via env to avoid template injection
          SETUP_RESULT: ${{ steps.setup.outcome == 'failure' && '✅ Pass' || '❌ Fail' }}
        run: |
          {
            echo "## Missing Tailscale Auth Test Summary"
            echo ""
            echo "- **Test Scenario:** Missing Tailscale authentication"
            echo "- **Expected:** Action fails with clear error message"
            echo "- **Result:** ${SETUP_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
