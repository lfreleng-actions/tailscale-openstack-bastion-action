---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: Test

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test bastion action"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Pin the installer too; the action SHA alone leaves uv floating.
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Hash-pinned via uv.lock; --locked rejects lockfile drift.
          uv sync --locked --extra test

      - name: Run tests with pytest
        run: |
          uv run --no-sync pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  workspace-isolation:
    name: "Test action ignores workspace Python"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # With the planted uv.toml, its required-version makes uv refuse
        # to look up an interpreter at all; without it, the lookup would
        # start a planted one. Run both.
        uv-toml: [true, false]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      # setup-uv in the action must not start an interpreter from the
      # caller's workspace. Each planted interpreter records that it ran.
      - name: Plant interpreters and uv settings in the workspace
        env:
          PLANT_UV_TOML: ${{ matrix.uv-toml }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/planted-ran"
          stub() {
            # $0 and $* expand when the stub runs, not here.
            # shellcheck disable=SC2016
            printf '#!/bin/sh\necho "%s: $0 $*" >> "%s"\nexit 1\n' \
              "$1" "$marker" > "$2"
            chmod +x "$2"
          }
          mkdir -p .venv/bin planted
          printf 'home = /usr/bin\nversion_info = 3.12.0\n' > .venv/pyvenv.cfg
          stub venv .venv/bin/python3
          stub venv .venv/bin/python
          stub python-version planted/python3
          echo "$GITHUB_WORKSPACE/planted/python3" > .python-version
          if [[ "$PLANT_UV_TOML" == "true" ]]; then
            printf '%s\n' 'cache-dir = "/nonexistent/planted-cache"' \
              'required-version = "==0.0.1"' > uv.toml
          fi

      # Teardown with placeholder credentials needs no secrets: the action
      # installs uv and the OpenStack CLI, then fails to authenticate
      # against an address where nothing listens. That failure is expected.
      - name: Run the action
        id: action
        continue-on-error: true
        uses: $/
        with:
          operation: "teardown"
          openstack_auth_url: "http://127.0.0.1:9/v3"
          openstack_project_id: "placeholder"
          openstack_username: "placeholder"
          # base64 of 'placeholder'
          openstack_password: "cGxhY2Vob2xkZXI=" # gitleaks:allow

      - name: Check the CLI installed and no planted interpreter ran
        env:
          ACTION_OUTCOME: ${{ steps.action.outcome }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/planted-ran"
          if [[ -e "$marker" ]]; then
            echo "::error::A planted workspace interpreter ran:"
            cat "$marker"
            exit 1
          fi
          if ! command -v openstack >/dev/null; then
            echo "::error::The action did not install the OpenStack CLI"
            exit 1
          fi
          openstack --version
          if [[ "$ACTION_OUTCOME" != "failure" ]]; then
            echo "::error::Expected the placeholder credentials to fail;" \
              "got outcome '$ACTION_OUTCOME'"
            exit 1
          fi

  caller-isolation:
    name: "Test action ignores caller Python settings"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        # request: variables that name an interpreter outright.
        # active-environment: variables that mark one as active.
        selector: [request, active-environment]

    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      # Bait in the workspace, and hostile settings exported through
      # $GITHUB_ENV, the way a caller's earlier step would. Every bait
      # records that it ran in a marker file the verify step checks.
      - name: Plant bait and hostile settings
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/bait-ran"
          ws="$GITHUB_WORKSPACE"
          stub() {
            # $0 and $* expand when the stub runs, not here.
            # shellcheck disable=SC2016
            printf '#!/bin/sh\necho "%s: $0 $*" >> "%s"\nexit 1\n' \
              "$1" "$marker" > "$2"
            chmod +x "$2"
          }
          mkdir -p .venv/bin .venv/conda-meta xdg-bin pkg urllib
          for name in python python3 python3.13 uv; do
            stub venv ".venv/bin/$name"
          done
          printf 'home = %s\nversion_info = 3.13.0\n' "$ws/.venv/bin" \
            > .venv/pyvenv.cfg
          stub xdg-bin xdg-bin/env
          stub xdg-bin xdg-bin/bash
          for module in json base64 sitecustomize usercustomize \
              urllib/__init__; do
            printf 'open(%s, "a").write("module: %s\\n")\n' \
              "'$marker'" "$module" > "$module.py"
          done

          # Control: the bait is live for a Python that is not isolated.
          system_python=$(command -v python3)
          PATH="$ws/.venv/bin:$PATH" python3 -c pass || true
          PYTHONPATH=pkg:. "$system_python" -c 'import json' || true
          for bait in venv: module:; do
            if ! grep -q "^$bait" "$marker"; then
              echo "::error::Control: '$bait' bait did not run"
              exit 1
            fi
          done
          rm -f "$marker"

          case "$RUNNER_ARCH" in
            X64) arch=x86_64 ;;
            ARM64) arch=aarch64 ;;
            *) arch="$RUNNER_ARCH" ;;
          esac
          {
            echo "PATH=$ws/.venv/bin:$PATH"
            echo "PYTHONPATH=pkg:."
            echo "PYTHONHOME=$ws/.venv"
            echo "PYTHONUSERBASE=$ws/.venv"
            echo "PYTHONSTARTUP=$ws/json.py"
            echo "PYTHONEXECUTABLE=$ws/.venv/bin/python3"
            echo "__PYVENV_LAUNCHER__=$ws/.venv/bin/python3"
            echo "UV_NO_CACHE=1"
            echo "UV_PYTHON_ARCH=$arch"
            echo "UV_PYTHON_INSTALL_MIRROR=https://127.0.0.1:9"
            echo "XDG_BIN_HOME=$ws/xdg-bin"
            if [[ "$SELECTOR" == "request" ]]; then
              echo "UV_PYTHON=$ws/.venv/bin/python3"
              echo "UV_PYTHON_SEARCH_PATH=$ws/.venv/bin"
              echo "UV_PYTHON_INSTALL_DIR=$ws/uv-python"
              echo "UV_PYTHON_PREFERENCE=only-system"
            else
              # UV_PYTHON stays unset so it cannot mask the discovery
              # of an active environment.
              echo "VIRTUAL_ENV=$ws/.venv"
              echo "CONDA_PREFIX=$ws/.venv"
              echo "CONDA_DEFAULT_ENV=base"
              echo "UV_INTERNAL__PARENT_INTERPRETER=$ws/.venv/bin/python3"
              echo "UV_INTERNAL__TEST_PYTHON_MANAGED=$ws/.venv/bin"
              echo "UV_CACHE_DIR=$ws/uv-cache"
            fi
          } >> "$GITHUB_ENV"

      # Teardown with placeholder credentials needs no secrets: the action
      # installs uv, Python and the OpenStack CLI, then fails to
      # authenticate against an address where nothing listens. That
      # failure is expected. The second run finds Python installed.
      - name: Run the action (cold)
        id: cold
        continue-on-error: true
        uses: $/
        with:
          operation: "teardown"
          openstack_auth_url: "http://127.0.0.1:9/v3"
          openstack_project_id: "placeholder"
          openstack_username: "placeholder"
          # base64 of 'placeholder'
          openstack_password: "cGxhY2Vob2xkZXI=" # gitleaks:allow

      - name: Run the action (warm)
        id: warm
        continue-on-error: true
        uses: $/
        with:
          operation: "teardown"
          openstack_auth_url: "http://127.0.0.1:9/v3"
          openstack_project_id: "placeholder"
          openstack_username: "placeholder"
          # base64 of 'placeholder'
          openstack_password: "cGxhY2Vob2xkZXI=" # gitleaks:allow

      - name: Check no bait ran and the action behaved as usual
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          COLD_STATUS: ${{ steps.cold.outputs.status }}
          WARM_OUTCOME: ${{ steps.warm.outcome }}
          WARM_STATUS: ${{ steps.warm.outputs.status }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/bait-ran"
          failed=0
          check_run() {
            if [[ "$2" != "failure" ]]; then
              echo "::error::$1 run: expected the placeholder credentials" \
                "to fail; got '$2'"
              failed=1
            fi
            if [[ -z "$3" ]]; then
              echo "::error::$1 run set no 'status' output"
              failed=1
            fi
          }
          check_run cold "$COLD_OUTCOME" "$COLD_STATUS"
          check_run warm "$WARM_OUTCOME" "$WARM_STATUS"
          expected="$RUNNER_TEMP/openstack-cli-bin/openstack"
          if [[ "$(command -v openstack)" != "$expected" ]]; then
            echo "::error::'openstack' is not the action's own CLI"
            failed=1
          fi
          # The CLI runs here with every hostile setting still in place.
          openstack --version || failed=1
          case ":$PATH:" in
            *":$GITHUB_WORKSPACE/xdg-bin:"*)
              echo "::error::The caller's XDG_BIN_HOME is on PATH"
              failed=1 ;;
          esac
          if [[ -e "$marker" ]]; then
            echo "::error::Bait ran:"
            cat "$marker"
            failed=1
          fi
          exit "$failed"
