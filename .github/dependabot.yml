version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(actions)"
    # Wait before opening a bump PR so we don't churn on a release
    # that gets retracted or superseded shortly after it ships. This
    # 7-day cooldown is a supply-chain security best practice: it gives
    # time for a bad release to be yanked before we adopt it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
  # The test dependencies and the OpenStack CLI the action installs on
  # the runner (the 'openstack-cli' dependency group) are locked with
  # uv (pyproject.toml + uv.lock); the uv ecosystem keeps that
  # universal lockfile current, for each CPython from 3.10.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
