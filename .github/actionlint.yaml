paths:
  .github/workflows/testing.yaml:
    ignore:
      # Deliberate test failures
      - 'input "invalid_input" is not defined in action .+'
      - 'missing input "input" which is required by action .+'
  .github/workflows/test-authkey.yaml:
    ignore:
      # The fork rejects a bare '$/' (an action at the repository
      # root), which GitHub accepts and runs.
      - 'specifying action "\$/" in invalid format because path is missing'
  .github/workflows/test-bastion-setup.yaml:
    ignore:
      # The fork rejects a bare '$/' (an action at the repository
      # root), which GitHub accepts and runs.
      - 'specifying action "\$/" in invalid format because path is missing'
  .github/workflows/test-error-handling.yaml:
    ignore:
      # The fork rejects a bare '$/' (an action at the repository
      # root), which GitHub accepts and runs.
      - 'specifying action "\$/" in invalid format because path is missing'
  .github/workflows/test-oauth-ephemeral.yaml:
    ignore:
      # The fork rejects a bare '$/' (an action at the repository
      # root), which GitHub accepts and runs.
      - 'specifying action "\$/" in invalid format because path is missing'
