[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packer-vexxhost-bastion-action"
version = "1.0.0"
description = "GitHub Action for building OpenStack images with Packer through Tailscale bastion"
readme = "ACTION_README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "The Linux Foundation", email = "releng@linuxfoundation.org"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "PyYAML>=6.0",
]

[dependency-groups]
# The OpenStack CLI the action installs on the runner for setup and
# teardown; installed on its own, locked and hash-checked through
# uv.lock, which Dependabot's uv ecosystem keeps current.
openstack-cli = ["python-openstackclient"]

# The tests read the action's YAML and scripts from the checkout and
# import nothing from this project, so uv never builds or installs it:
# 'uv sync --locked --extra test' installs the test extra alone, with
# no unlocked fetch of the build backend.
[tool.uv]
package = false

# A workspace root of its own, with no members, so uv stops looking
# upward from here. Without it, an action vendored inside a caller's
# uv workspace that lists its directory as a member would sync against
# the caller's lockfile rather than this uv.lock.
[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
minversion = "9.0.3"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Note: Code coverage is disabled for this action as it primarily
# consists of shell scripts and YAML configurations.
# Tests validate action configurations, workflows, and script syntax.

[tool.basedpyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"
# The directories the pre-commit hook passes, so that a bare run and
# the editor check the same code.
include = ["scripts", "tests"]
